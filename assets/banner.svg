<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#05080f" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="badgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <radialGradient id="centerRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#06b6d4" fill-opacity="0.25" />
    </pattern>

    <!-- Filter Shadows -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)" />
  <rect width="1200" height="400" fill="url(#techGrid)" />
  <circle cx="400" cy="200" r="350" fill="url(#centerRadial)" />

  <!-- Abstract Tech Circuit Accents -->
  <g stroke="#06b6d4" stroke-opacity="0.25" stroke-width="1.5" fill="none">
    <path d="M 100 200 L 250 200 L 290 160 L 380 160" />
    <circle cx="100" cy="200" r="3" fill="#06b6d4" fill-opacity="0.4" />
    <circle cx="380" cy="160" r="3" fill="#10b981" fill-opacity="0.6" />

    <path d="M 950 100 L 1020 100 L 1060 140 L 1120 140" />
    <circle cx="950" cy="100" r="3" fill="#3b82f6" fill-opacity="0.5" />
    <circle cx="1120" cy="140" r="3" fill="#06b6d4" fill-opacity="0.4" />

    <path d="M 880 320 L 960 320 L 1000 280 L 1100 280" />
    <circle cx="880" cy="320" r="3" fill="#10b981" fill-opacity="0.5" />
  </g>

  <!-- Left Lock/Shield Vector Graphic -->
  <g transform="translate(140, 110)">
    <!-- Glow Ring -->
    <circle cx="90" cy="90" r="75" fill="none" stroke="url(#primaryGlow)" stroke-width="1.5" stroke-opacity="0.3" filter="url(#glowFilter)" />
    <circle cx="90" cy="90" r="65" fill="#0f172a" stroke="#1e293b" stroke-width="2" />

    <!-- Padlock Body -->
    <rect x="62" y="78" width="56" height="44" rx="8" fill="url(#primaryGlow)" />
    <!-- Shackle -->
    <path d="M 72 78 L 72 58 C 72 48 108 48 108 58 L 108 78" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" />
    <!-- Keyhole -->
    <circle cx="90" cy="96" r="4.5" fill="#0f172a" />
    <path d="M 88 96 L 92 96 L 93 108 L 87 108 Z" fill="#0f172a" />

    <!-- Mini Pulse Nodes -->
    <circle cx="90" cy="90" r="85" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4 8" stroke-opacity="0.4" />
  </g>

  <!-- Main Typography -->
  <g transform="translate(360, 110)">
    <!-- Small Category Pill -->
    <g transform="translate(0, 0)">
      <rect width="186" height="26" rx="13" fill="#0e7490" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="14" cy="13" r="4" fill="#10b981" />
      <text x="26" y="17" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">ZERO-KNOWLEDGE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="80" fill="url(#primaryGlow)" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5">GDE</text>
    <text x="145" y="80" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="600" letter-spacing="-0.5">Google Drive Encryption</text>

    <!-- Description Line -->
    <text x="2" y="118" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
      Military-grade client-side encryption for cloud storage via Model Context Protocol.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 142)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="168" height="32" rx="6" fill="url(#badgeGlow)" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">ChaCha20-Poly1305</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(180, 0)">
        <rect width="156" height="32" rx="6" fill="url(#badgeGlow)" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Per-File Unique Key</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(348, 0)">
        <rect width="146" height="32" rx="6" fill="url(#badgeGlow)" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Local SQLite Vault</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(506, 0)">
        <rect width="160" height="32" rx="6" fill="url(#badgeGlow)" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">GDrive MCP Native</text>
      </g>
    </g>
  </g>

  <!-- Subtle Bottom Border Indicator -->
  <line x1="0" y1="398" x2="1200" y2="398" stroke="url(#primaryGlow)" stroke-width="2" stroke-opacity="0.6" />
</svg>
